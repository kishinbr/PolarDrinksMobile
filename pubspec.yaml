name: polardrinks
description: "App da loja online Polar Drinks."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins_900Black.ttf
          weight: 900
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat_900Black.ttf
          weight: 900
